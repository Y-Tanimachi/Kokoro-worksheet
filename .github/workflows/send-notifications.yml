name: Send Daily Reminders

on:
  schedule:
    # 12:00 JST = 03:00 UTC
    - cron: "0 3 * * *"
    # 18:00 JST = 09:00 UTC
    - cron: "0 9 * * *"
  # 設定変更後の動作確認を次の cron まで待たずに行えるよう手動実行を許可する
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to users without today's entry
        run: |
          # ステータスコードを明示的に判定する理由: curl の --fail 系オプションは 3xx を
          # 失敗にしないため、APP_URL の設定ミス（http:// や末尾スラッシュ）による
          # 308 リダイレクトでもジョブが緑のままになり、通知停止に気づけない
          # （2026-06-28〜07-25 に実際に発生）。200 以外はすべて失敗させる。
          # x-vercel-protection-bypass: GitHub Actions ランナーの共有 IP は Vercel の
          # エッジ（ボット対策）に 403 でブロックされることがある（2026-06-25 / 07-26 に発生）。
          # Firewall の Allow ルールはダッシュボード操作で消えると再発するため、
          # Protection Bypass for Automation のシークレットをヘッダーで送って
          # エッジの遮断をワークフロー側から確実にバイパスする。
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.APP_URL }}/api/notifications/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            -H "Content-Type: application/json")
          echo "$response"
          status="${response##*HTTP_STATUS:}"
          if [ "$status" != "200" ]; then
            echo "::error::API が HTTP ${status} を返しました（200 以外は通知未送信とみなして失敗扱い）"
            exit 1
          fi
